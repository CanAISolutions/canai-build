name: Cortex Memory Validation

on:
  push:
    branches: [main, develop]
    - '.cursor/rules/cortex.md'
      - 'docs/**/*.md'
  pull_request:
    branches: [main, develop]
    - '.cursor/rules/cortex.md'
      - 'docs/**/*.md'
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

jobs:
  validate-cortex:
    name: Validate Cortex Memory
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Markdown Files
        run: |
          for file in $(find . -name '*.md'); do
            if [ -f "$file" ]; then
              echo "Validating $file"
              grep -q "## Current Milestone" "$file" || echo "Milestone tracking not found in $file"
              grep -q "## Completed Tasks" "$file" || echo "Task completion tracking not found in $file"
              grep -q "## Project Memory" "$file" || echo "Project memory section not found in $file"
            fi
done

  validate-taskmaster:
    name: Validate TaskMaster Tasks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check TaskMaster file exists
        run: |
          if [ ! -f "Taskmaster-Tasks.md" ]; then
            echo "❌ Taskmaster-Tasks.md not found"
            exit 1
          fi
          echo "✅ Taskmaster-Tasks.md exists"

      - name: Validate task structure
        run: |
          grep -q "## Backend Implementation" Taskmaster-Tasks.md || exit 1
          echo "✅ Backend tasks section present"
